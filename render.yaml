services:
  - type: web
    name: payment-service
    runtime: python
    plan: free
    region: singapore  # same region as the Supabase database (ap-southeast-1)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
